services:
  postgres:
    image: postgres:16-alpine
    container_name: studio-postgres
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio_db"]
      interval: 5s
      timeout: 3s
      retries: 12

  adminer:
    image: adminer:4.8.1
    container_name: studio-adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  api:
    build:
      context: ./apps/api
    container_name: studio-api
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://studio:studio@postgres:5432/studio_db
      API_CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:

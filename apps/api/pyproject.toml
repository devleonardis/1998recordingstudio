[project]
name = "studio-api"
version = "1.0.0"
description = "FastAPI backend for 1998 Recording Studio"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.6",
  "google-api-python-client>=2.170.0",
  "google-auth>=2.40.3",
  "psycopg2-binary>=2.9.10",
  "pydantic-settings>=2.7.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.19",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0"
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-mock>=3.15.1",
  "ruff>=0.8.4",
]
